<title>مِيزان الأبواب الأربعة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: iOS grouped-inset lists under a large title, four doors on a bottom tab bar, RTL throughout.
   Every row opens an edit sheet; nothing in the app is fixed. */
:root{
  /* Color: Najaf tilework indigo + engraved brass on cool paper */
  --bg:#EFF1F5;
  --surface:#FFFFFF;
  --surface-2:#F7F8FA;
  --fg:#111820;
  --fg-dim:#5C6775;
  --hair:#DDE1E8;
  --brass:#8A5E1E;
  --brass-soft:#F2E6D0;
  --indigo:#1F4E66;
  --good:#1E7A54;
  --warn:#9A6314;
  --crit:#A62F26;
  --shadow:0 1px 2px rgba(17,24,32,.06),0 8px 24px rgba(17,24,32,.05);
  --font-display:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1419;--surface:#171F26;--surface-2:#1E272F;--fg:#E8ECF1;--fg-dim:#9AA7B4;
    --hair:#2A343D;--brass:#D2A44F;--brass-soft:#2A2114;--indigo:#6FA8C4;
    --good:#49BC8B;--warn:#D9A445;--crit:#E8766A;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1419;--surface:#171F26;--surface-2:#1E272F;--fg:#E8ECF1;--fg-dim:#9AA7B4;
  --hair:#2A343D;--brass:#D2A44F;--brass-soft:#2A2114;--indigo:#6FA8C4;
  --good:#49BC8B;--warn:#D9A445;--crit:#E8766A;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;max-width:620px;margin-inline:auto}
main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding-block:10px 6px;display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;flex:none;border-radius:9px;box-shadow:var(--shadow)}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px}
.brand small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--fg-dim)}
.topbar .spacer{flex:1}
.ghost{appearance:none;background:var(--surface);border:1px solid var(--hair);color:var(--fg-dim);border-radius:999px;font-family:inherit;font-size:12px;padding:6px 11px;cursor:pointer}
.ghost:hover{color:var(--fg)}
h1.title{font-family:var(--font-display);font-size:26px;font-weight:700;margin:4px 0 2px;text-wrap:balance}
.sub{color:var(--fg-dim);font-size:12.5px;margin-bottom:12px}

.month{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--hair);border-radius:999px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.month button{appearance:none;border:0;background:transparent;color:var(--fg);font-family:inherit;font-size:17px;width:34px;height:30px;border-radius:999px;cursor:pointer}
.month button:hover{background:var(--surface-2)}
.month .label{flex:1;text-align:center;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums}

.group{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.group>header{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--hair);background:var(--surface-2)}
.group>header .nm{font-family:var(--font-display);font-weight:500;font-size:13.5px;flex:1;min-width:0}
.group>header .sum{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;color:var(--brass)}
.glyph{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--brass-soft);font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--hair);width:100%;text-align:start;background:none;border-inline:0;border-top:0;font-family:inherit;color:var(--fg);font-size:inherit}
.row:last-child{border-bottom:0}
button.row{cursor:pointer}
button.row:hover{background:var(--surface-2)}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:500;font-size:14px}
.row .nm span{display:block;color:var(--fg-dim);font-size:11.5px}
.row .val{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;white-space:nowrap}
.row.muted .val{color:var(--fg-dim);font-weight:400}
.chev{color:var(--fg-dim);font-size:15px;flex:none}
.bar{height:4px;border-radius:999px;background:var(--hair);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brass)}
.chip{font-size:11px;padding:3px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--hair);color:var(--fg-dim);white-space:nowrap}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.sub-list{background:var(--surface-2);border-bottom:1px solid var(--hair)}
.sub-list .row{padding-inline-start:30px;background:none}

.total{background:linear-gradient(160deg,var(--indigo),color-mix(in srgb,var(--indigo) 65%,#000));color:#fff;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.total .k{font-size:12px;opacity:.85}
.total .v{font-family:var(--font-display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25;margin:2px 0 10px}
.total .legs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.total .leg{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;min-width:0}
.total .leg b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.total .leg span{font-size:11px;opacity:.85}

.nl{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;margin-bottom:14px}
.nl label{display:block;font-family:var(--font-display);font-size:13px;font-weight:500;margin-bottom:7px}
.nl textarea{width:100%;min-height:58px;resize:vertical;font-family:inherit;font-size:14.5px;line-height:1.6;color:var(--fg);background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;padding:10px}
.nl .hint{color:var(--fg-dim);font-size:11.5px;margin-top:6px}
.preview{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.pv{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;padding:7px 10px;font-size:13px}
.pv .p1{flex:1;min-width:0}
.pv .p2{font-variant-numeric:tabular-nums;font-weight:600}
.pv.bad{border-style:dashed;color:var(--fg-dim)}
.cta{appearance:none;width:100%;margin-top:10px;border:0;border-radius:11px;background:var(--brass);color:#fff;font-family:var(--font-display);font-weight:500;font-size:15px;padding:11px;cursor:pointer}
.cta[disabled]{opacity:.45;cursor:default}
.cta.sec{background:transparent;color:var(--brass);border:1px solid var(--brass)}
.cta.danger{background:transparent;color:var(--crit);border:1px solid var(--crit)}
.cta.danger.armed{background:var(--crit);color:#fff}

input,select,textarea{font-family:inherit;font-size:14.5px;color:var(--fg);background:var(--surface-2);border:1px solid var(--hair);border-radius:10px;padding:10px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.field{margin-bottom:9px}
.field label{display:block;font-size:12px;color:var(--fg-dim);margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.tick{appearance:none;width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--hair);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;color:transparent;font-size:14px}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.mini{appearance:none;border:1px solid var(--hair);background:var(--surface-2);color:var(--fg);border-radius:9px;font-family:inherit;font-size:12px;padding:6px 10px;cursor:pointer;white-space:nowrap;flex:none}
.mini:hover{border-color:var(--brass);color:var(--brass)}
.empty{text-align:center;color:var(--fg-dim);font-size:13px;padding:20px 14px}
.empty b{display:block;font-family:var(--font-display);color:var(--fg);font-size:15px;margin-bottom:4px}
.note{background:var(--brass-soft);border:1px solid color-mix(in srgb,var(--brass) 25%,transparent);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-bottom:14px}
.note .cta{margin-top:8px}

.tl{position:relative;padding-inline-start:18px}
.tl::before{content:"";position:absolute;inset-block:6px;inset-inline-start:5px;width:2px;background:var(--hair)}
.tl .ev{position:relative;margin-bottom:12px}
.tl .ev::before{content:"";position:absolute;inset-inline-start:-17px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 3px var(--bg)}
.ev .box{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:11px 12px;box-shadow:var(--shadow);width:100%;text-align:start;font-family:inherit;color:var(--fg);cursor:pointer}
.ev .when{font-size:11.5px;color:var(--fg-dim);font-variant-numeric:tabular-nums;margin-bottom:3px}
.ev .what{font-family:var(--font-display);font-size:14px;font-weight:500}
.ev .story{font-size:13px;color:var(--fg-dim);margin-top:4px;white-space:pre-wrap}

.tabs{position:fixed;inset-inline:0;bottom:0;z-index:18;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--hair);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .inner{max-width:620px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{appearance:none;border:0;background:transparent;color:var(--fg-dim);font-family:inherit;padding:8px 2px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button b{font-family:var(--font-display);font-size:11px;font-weight:500}
.tabs button span{font-size:9.5px;opacity:.75}
.tabs button[aria-current="true"]{color:var(--brass)}
.tabs .ico{width:22px;height:22px}

/* edit sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(8,12,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:620px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
.sheet h2{font-family:var(--font-display);font-size:17px;margin:0 0 12px}
.sheet .grab{width:38px;height:4px;border-radius:999px;background:var(--hair);margin:0 auto 12px}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .22s ease both}
  @keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
}
</style>

<div id="app" dir="rtl">
  <div class="wrap">
    <div class="topbar">
      <svg class="mark" viewBox="0 0 64 64" aria-label="شعار ميزان"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#235A74"/><stop offset="1" stop-color="#143847"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#lg)"/><g stroke="#D9AE62" stroke-width="2.6" fill="none" stroke-linecap="round"><path d="M32 13v34"/><path d="M15 23h34"/><path d="M15 23l-6 12h12z"/><path d="M49 23l-6 12h12z"/><path d="M23 50h18"/></g><circle cx="32" cy="11" r="3" fill="#D9AE62"/></svg>
      <div class="brand">مِيزان<small>أربعة أبواب لإدارة البيت</small></div>
      <div class="spacer"></div>
      <button class="ghost" id="dataBtn" type="button">البيانات</button>
      <button class="ghost" id="themeBtn" type="button">المظهر</button>
    </div>
    <main>
      <h1 class="title" id="doorTitle"></h1>
      <div class="sub" id="doorSub"></div>
      <div id="screen"></div>
    </main>
  </div>
  <nav class="tabs" aria-label="الأبواب الأربعة"><div class="inner" id="tabs"></div></nav>
</div>
<div id="sheetHost"></div>

<script>
/* ============================ helpers ============================ */
const $ = (s, r = document) => r.querySelector(s);
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h != null) n.innerHTML = h; return n; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const KEY = 'mizan.v3';
const AR = '٠١٢٣٤٥٦٧٨٩', FA = '۰۱۲۳۴۵۶۷۸۹';

try { document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar'; } catch (e) {}

const fmt = n => new Intl.NumberFormat('en-US').format(Math.round(n || 0)) + ' د.ع';
const today = () => new Date().toISOString().slice(0, 10);
const monthOf = d => String(d).slice(0, 7);
const MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const monthLabel = m => { const [y, mm] = String(m).split('-'); return MONTHS[+mm - 1] + ' ' + y; };
const dateLabel = d => { const t = new Date(d + 'T00:00:00'); return isNaN(t) ? d : t.getDate() + ' ' + MONTHS[t.getMonth()] + ' ' + t.getFullYear(); };
const digits = s => String(s).replace(/[٠-٩]/g, c => AR.indexOf(c)).replace(/[۰-۹]/g, c => FA.indexOf(c));
const toNum = s => { const v = parseFloat(digits(String(s)).replace(/[.,\s]/g, '')); return isFinite(v) ? v : 0; };

/* ============================ defaults ============================ */
const DEFAULT_TREE = () => ([
  { id: 'tariya',  nm: 'الطرية',  g: '🥬', subs: ['خضروات', 'فواكه', 'عصائر', 'ألبان'] },
  { id: 'jaffa',   nm: 'الجافة',  g: '🍚', subs: ['رز', 'عدس', 'معجون', 'تنظيفات', 'مواد أخرى'] },
  { id: 'luhum',   nm: 'اللحوم',  g: '🍖', subs: ['دجاج', 'لحم', 'لحم مفروم'] },
  { id: 'khubz',   nm: 'الصمون والخبز', g: '🥖', subs: ['صمون', 'خبز'] },
  { id: 'ilaj',    nm: 'العلاجات ومراجعات الأطباء', g: '💊', subs: ['أدوية', 'مراجعة طبيب', 'تحاليل'] },
  { id: 'masarif', nm: 'المصروفات المخصصة', g: '👛', subs: ['مصرف شخصي', 'مصرف الزوجة', 'مصرف الأولاد', 'مصرف السيارة'] },
  { id: 'ghaz',    nm: 'غاز أو نفط', g: '🔥', subs: ['غاز', 'نفط'] },
  { id: 'bina',    nm: 'التصليحات والبناء', g: '🧱', subs: ['تصليحات', 'بناء', 'مواد بناء'] },
  { id: 'projects', nm: 'تكاليف المشاريع', g: '🏗️', subs: [], outside: true, byName: true },
  { id: 'tawari',   nm: 'الطوارئ', g: '🚨', subs: ['طوارئ'], outside: true },
  { id: 'wuqud',    nm: 'المحروقات', g: '⛽', subs: ['بنزين', 'ديزل', 'كاز'], outside: true }
]);

const SYN = [
  ['لبن','tariya','ألبان'],['حليب','tariya','ألبان'],['جبن','tariya','ألبان'],['لبنه','tariya','ألبان'],
  ['خضره','tariya','خضروات'],['طماطم','tariya','خضروات'],['فاكهه','tariya','فواكه'],['عصير','tariya','عصائر'],
  ['دجاجه','luhum','دجاج'],['مفروم','luhum','لحم مفروم'],['لحمه','luhum','لحم'],
  ['دواء','ilaj','أدوية'],['علاج','ilaj','أدوية'],['طبيب','ilaj','مراجعة طبيب'],['دكتور','ilaj','مراجعة طبيب'],['تحليل','ilaj','تحاليل'],
  ['مصروفي','masarif','مصرف شخصي'],['شخصي','masarif','مصرف شخصي'],['الزوجه','masarif','مصرف الزوجة'],['زوجتي','masarif','مصرف الزوجة'],
  ['الاولاد','masarif','مصرف الأولاد'],['اولاد','masarif','مصرف الأولاد'],['العيال','masarif','مصرف الأولاد'],
  ['السياره','masarif','مصرف السيارة'],['سياره','masarif','مصرف السيارة'],
  ['تصليح','bina','تصليحات'],['ترميم','bina','بناء'],
  ['محروقات','wuqud','بنزين'],['وقود','wuqud','بنزين'],
  ['طاري','tawari','طوارئ'],['مفاجئ','tawari','طوارئ']
];

function seed() {
  const d = today();
  const back = n => { const x = new Date(); x.setDate(x.getDate() - n); return x.toISOString().slice(0, 10); };
  return {
    v: 3, month: monthOf(d), door: 1, theme: null, demo: true, tree: DEFAULT_TREE(),
    spend: [
      { id: 1, date: back(3), gid: 'tariya', sub: 'ألبان', amount: 10000, note: '' },
      { id: 2, date: back(3), gid: 'masarif', sub: 'مصرف الأولاد', amount: 15000, note: '' },
      { id: 3, date: back(3), gid: 'khubz', sub: 'صمون', amount: 3000, note: '' },
      { id: 4, date: d, gid: 'luhum', sub: 'دجاج', amount: 12000, note: '' },
      { id: 5, date: d, gid: 'wuqud', sub: 'بنزين', amount: 25000, note: '' },
      { id: 6, date: d, gid: 'projects', sub: 'ترميم غرفة النوم', amount: 90000, note: 'دفعة أولى' },
      { id: 7, date: back(3), gid: 'tawari', sub: 'طوارئ', amount: 20000, note: 'تصليح مفاجئ' }
    ],
    daily: [ { id: 11, nm: 'أذكار شخصية', note: 'الورد اليومي', done: {} }, { id: 12, nm: 'أذكار غير شخصية', note: 'نيابة عن الوالدين', done: {} } ],
    periodic: [ { id: 21, nm: 'زيارة المراقد المقدسة', every: 30, last: back(3) }, { id: 22, nm: 'زيارة الأهل', every: 7, last: back(3) }, { id: 23, nm: 'زيارة الأقارب', every: 14, last: null } ],
    doctors: [ { id: 31, date: back(3), who: 'د. علي — باطنية', why: 'مراجعة دورية', dx: 'ضغط مرتفع قليلاً', next: 'إعادة التحليل بعد شهر' } ],
    proposals: [
      { id: 41, kind: 'ترميم', nm: 'ترميم غرفة النوم', est: 250000, status: 'قيد التنفيذ' },
      { id: 42, kind: 'تصليح', nm: 'تصليح مضخة الماء', est: 60000, status: 'مقترح' },
      { id: 43, kind: 'مراجعات رسمية', nm: 'تحديث هوية الأحوال', est: 25000, status: 'مقترح' }
    ],
    log: [
      { id: 51, date: back(3), what: 'زيارة الأهل', story: 'زيارة بيت الوالد بعد صلاة المغرب، أخذنا معنا صمون وفواكه.' },
      { id: 52, date: back(3), what: 'مراجعة د. علي', story: 'الضغط مرتفع قليلاً، طلب إعادة التحليل بعد شهر وتقليل الملح.' }
    ],
    seq: 100
  };
}

let S;
try {
  S = JSON.parse(localStorage.getItem(KEY));
  if (!S) { const old = JSON.parse(localStorage.getItem('mizan.v2')); if (old && old.spend) { S = Object.assign(seed(), old, { v: 3, tree: DEFAULT_TREE() }); } }
} catch (e) { S = null; }
if (!S || !S.spend) S = seed();
if (!Array.isArray(S.tree) || !S.tree.length) S.tree = DEFAULT_TREE();
S.month = S.month || monthOf(today());
S.seq = S.seq || 100;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const nextId = () => ++S.seq;
const group = id => S.tree.find(g => g.id === id);
const insideTree = () => S.tree.filter(g => !g.outside);
const outsideTree = () => S.tree.filter(g => g.outside);

/* ============================ sums ============================ */
const inMonth = () => S.spend.filter(e => monthOf(e.date) === S.month);
const sumGroup = gid => inMonth().filter(e => e.gid === gid).reduce((a, e) => a + e.amount, 0);
const sumSub = (gid, sub) => inMonth().filter(e => e.gid === gid && e.sub === sub).reduce((a, e) => a + e.amount, 0);
const sumMonthly = () => insideTree().reduce((a, g) => a + sumGroup(g.id), 0);
const sumAll = () => S.tree.reduce((a, g) => a + sumGroup(g.id), 0);

/* ============================ parser ============================ */
function norm(s) {
  return digits(s).replace(/[ً-ْـ]/g, '').replace(/[أإآٱ]/g, 'ا')
    .replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي').replace(/ة/g, 'ه')
    .replace(/\s+/g, ' ').trim();
}
function keywordIndex() {
  const out = [];
  S.tree.forEach(g => (g.subs || []).forEach(s => out.push({ w: norm(s), gid: g.id, sub: s })));
  SYN.forEach(([w, gid, sub]) => { const g = group(gid); if (g && (g.subs || []).includes(sub)) out.push({ w: norm(w), gid, sub }); });
  return out.sort((a, b) => b.w.length - a.w.length);
}
function parseLine(raw) {
  const t = norm(raw), hits = [];
  keywordIndex().forEach(({ w, gid, sub }) => {
    if (!w) return;
    let i = t.indexOf(w);
    while (i !== -1) {
      if (!hits.some(h => i < h.at + h.len && i + w.length > h.at)) hits.push({ at: i, len: w.length, gid, sub });
      i = t.indexOf(w, i + w.length);
    }
  });
  hits.sort((a, b) => a.at - b.at);
  const nums = []; const re = /(\d[\d.,]*)\s*(الف|ك)?/g; let m;
  while ((m = re.exec(t)) !== null) {
    const v = parseFloat(m[1].replace(/[.,]/g, ''));
    if (isFinite(v)) nums.push({ at: m.index, v: v * (m[2] ? 1000 : 1) });
  }
  const out = [];
  hits.forEach((h, k) => {
    const stop = k + 1 < hits.length ? hits[k + 1].at : Infinity;
    const n = nums.find(x => x.at >= h.at && x.at < stop && !x.used);
    if (n) { n.used = true; out.push({ gid: h.gid, sub: h.sub, amount: n.v }); }
  });
  return { entries: out, orphan: nums.filter(n => !n.used).length };
}

/* ============================ edit sheet ============================ */
let armed = null;
function closeSheet() { $('#sheetHost').textContent = ''; armed = null; }

/**
 * One editor for everything. fields: {id,label,type,value,options,ph}
 * type: text | money | date | number | select | area | emoji
 */
function sheet({ title, fields = [], onSave, onDelete, saveLabel = 'حفظ', deleteLabel = 'حذف', extra }) {
  const host = $('#sheetHost');
  host.textContent = ''; armed = null;
  const scrim = el('div', 'scrim');
  const box = el('div', 'sheet');
  box.appendChild(el('div', 'grab'));
  box.appendChild(el('h2', null, esc(title)));

  fields.forEach(f => {
    const wrap = el('div', 'field');
    wrap.appendChild(el('label', null, esc(f.label)));
    let input;
    if (f.type === 'select') {
      input = el('select');
      (f.options || []).forEach(o => {
        const opt = el('option', null, esc(o.label != null ? o.label : o));
        opt.value = o.value != null ? o.value : o;
        if (String(opt.value) === String(f.value)) opt.selected = true;
        input.appendChild(opt);
      });
    } else if (f.type === 'area') {
      input = el('textarea'); input.rows = 4; input.value = f.value || '';
    } else {
      input = el('input');
      input.type = f.type === 'date' ? 'date' : 'text';
      if (f.type === 'money' || f.type === 'number') input.inputMode = 'numeric';
      input.value = f.type === 'money' ? (f.value ? new Intl.NumberFormat('en-US').format(f.value) : '') : (f.value == null ? '' : f.value);
      if (f.ph) input.placeholder = f.ph;
    }
    input.id = 'f_' + f.id;
    wrap.appendChild(input);
    box.appendChild(wrap);
  });

  if (extra) box.appendChild(extra);

  const read = () => {
    const out = {};
    fields.forEach(f => {
      const v = $('#f_' + f.id, box).value;
      out[f.id] = (f.type === 'money' || f.type === 'number') ? toNum(v) : String(v).trim();
    });
    return out;
  };

  const ok = el('button', 'cta', saveLabel);
  ok.onclick = () => { const v = read(); if (onSave(v) !== false) { save(); closeSheet(); render(); } };
  box.appendChild(ok);

  if (onDelete) {
    const del = el('button', 'cta danger', deleteLabel);
    del.onclick = () => {
      if (armed !== del) { armed = del; del.classList.add('armed'); del.textContent = 'اضغط مرة أخرى للحذف نهائياً'; return; }
      onDelete(); save(); closeSheet(); render();
    };
    box.appendChild(del);
  }
  const cancel = el('button', 'cta sec', 'إلغاء');
  cancel.onclick = closeSheet;
  box.appendChild(cancel);

  scrim.onclick = e => { if (e.target === scrim) closeSheet(); };
  scrim.appendChild(box);
  host.appendChild(scrim);
  const first = box.querySelector('input,select,textarea'); if (first) first.focus();
}

/* every category, as options for a picker */
const subOptions = () => {
  const out = [];
  S.tree.forEach(g => {
    if (g.byName) { out.push({ value: g.id + '|', label: g.g + ' ' + g.nm + ' (باسم المشروع)' }); return; }
    (g.subs || []).forEach(s => out.push({ value: g.id + '|' + s, label: g.g + ' ' + g.nm + ' · ' + s }));
  });
  return out;
};

/* ============================ door 1 ============================ */
function editEntry(entry) {
  const isNew = !entry.id;
  sheet({
    title: isNew ? 'بند جديد' : 'تعديل البند',
    fields: [
      { id: 'cat', label: 'الفئة', type: 'select', value: entry.gid + '|' + (group(entry.gid) && group(entry.gid).byName ? '' : entry.sub), options: subOptions() },
      { id: 'name', label: 'الاسم (للمشاريع، أو وصف مختصر)', type: 'text', value: group(entry.gid) && group(entry.gid).byName ? entry.sub : '', ph: 'اسم المشروع' },
      { id: 'amount', label: 'المبلغ', type: 'money', value: entry.amount, ph: '10,000' },
      { id: 'date', label: 'التاريخ', type: 'date', value: entry.date || today() },
      { id: 'note', label: 'ملاحظة', type: 'text', value: entry.note || '' }
    ],
    onSave: v => {
      const [gid, sub] = String(v.cat).split('|');
      const g = group(gid);
      const name = g && g.byName ? (v.name || 'مشروع') : (sub || v.name || g.nm);
      if (!v.amount) return false;
      if (isNew) S.spend.push({ id: nextId(), date: v.date || today(), gid, sub: name, amount: v.amount, note: v.note });
      else Object.assign(entry, { gid, sub: name, amount: v.amount, date: v.date || today(), note: v.note });
      S.demo = false;
    },
    onDelete: isNew ? null : () => { S.spend = S.spend.filter(x => x.id !== entry.id); }
  });
}

function editGroup(g) {
  const isNew = !g;
  const current = g || { id: 'g' + nextId(), nm: '', g: '📦', subs: [], outside: false };
  sheet({
    title: isNew ? 'فئة رئيسية جديدة' : 'تعديل ' + current.nm,
    fields: [
      { id: 'g', label: 'الرمز', type: 'text', value: current.g },
      { id: 'nm', label: 'الاسم', type: 'text', value: current.nm, ph: 'اسم الفئة' },
      { id: 'subs', label: 'الفئات الفرعية، كل واحدة في سطر', type: 'area', value: (current.subs || []).join('\n') },
      { id: 'outside', label: 'خارج الإنفاق الشهري؟', type: 'select', value: current.outside ? '1' : '0', options: [{ value: '0', label: 'داخل الإنفاق الشهري' }, { value: '1', label: 'مستقلة (مثل المحروقات)' }] }
    ],
    onSave: v => {
      if (!v.nm) return false;
      const subs = v.subs.split('\n').map(s => s.trim()).filter(Boolean);
      // Renaming a sub keeps its entries: match by position where the count is unchanged.
      if (!isNew && current.subs.length === subs.length) {
        current.subs.forEach((old, i) => {
          if (old !== subs[i]) S.spend.forEach(e => { if (e.gid === current.id && e.sub === old) e.sub = subs[i]; });
        });
      }
      Object.assign(current, { nm: v.nm, g: v.g || '📦', subs, outside: v.outside === '1' });
      if (isNew) S.tree.push(current);
    },
    onDelete: isNew ? null : () => {
      S.tree = S.tree.filter(x => x.id !== current.id);
      S.spend = S.spend.filter(e => e.gid !== current.id);
    },
    deleteLabel: isNew ? 'حذف' : 'حذف الفئة وكل بنودها'
  });
}

function entriesOf(gid, sub) {
  return inMonth().filter(e => e.gid === gid && (sub == null || e.sub === sub)).sort((a, b) => b.date.localeCompare(a.date));
}

function renderMoney() {
  const box = el('div');
  const grand = sumAll();
  const tile = el('div', 'total');
  tile.innerHTML = `<div class="k">الناتج المالي لشهر ${esc(monthLabel(S.month))}</div><div class="v">${esc(fmt(grand))}</div>`;
  const legs = el('div', 'legs');
  legs.appendChild(el('div', 'leg', `<b>${esc(fmt(sumMonthly()))}</b><span>الإنفاق الشهري</span>`));
  outsideTree().forEach(g => legs.appendChild(el('div', 'leg', `<b>${esc(fmt(sumGroup(g.id)))}</b><span>${esc(g.nm)}</span>`)));
  tile.appendChild(legs);
  box.appendChild(tile);

  box.appendChild(nlCard());

  S.tree.forEach(g => {
    const total = sumGroup(g.id);
    const card = el('div', 'group');
    const head = el('header');
    head.innerHTML = `<div class="glyph">${esc(g.g)}</div><div class="nm">${esc(g.nm)}${g.outside ? ' <span class="chip">مستقلة</span>' : ''}</div><div class="sum">${esc(fmt(total))}</div>`;
    const edit = el('button', 'mini', 'تعديل');
    edit.onclick = () => editGroup(g);
    head.appendChild(edit);
    card.appendChild(head);

    if (g.byName) {
      const items = {};
      entriesOf(g.id).forEach(e => { (items[e.sub] = items[e.sub] || []).push(e); });
      const names = Object.keys(items);
      if (!names.length) card.appendChild(el('div', 'empty', '<b>لا يوجد تسجيل</b>أضف تكلفة باسم المشروع.'));
      names.forEach(nm => {
        const sum = items[nm].reduce((a, e) => a + e.amount, 0);
        const row = el('button', 'row');
        row.type = 'button';
        row.innerHTML = `<div class="nm"><b>${esc(nm)}</b><span>${items[nm].length} بند</span></div><div class="val">${esc(fmt(sum))}</div><span class="chev">‹</span>`;
        row.onclick = () => showEntries(g.id, nm);
        card.appendChild(row);
      });
    } else {
      (g.subs || []).forEach(sub => {
        const v = sumSub(g.id, sub);
        const row = el('button', 'row' + (v ? '' : ' muted'));
        row.type = 'button';
        row.innerHTML = `<div class="nm"><b>${esc(sub)}</b>${v && total ? `<div class="bar"><i style="width:${Math.round(v / total * 100)}%"></i></div>` : ''}</div>
          <div class="val">${v ? esc(fmt(v)) : '—'}</div><span class="chev">‹</span>`;
        row.onclick = () => showEntries(g.id, sub);
        card.appendChild(row);
      });
    }
    const foot = el('div', 'row');
    const add = el('button', 'mini', 'أضف بنداً');
    add.onclick = () => editEntry({ gid: g.id, sub: (g.subs || [])[0] || g.nm, amount: 0, date: today() });
    foot.appendChild(add);
    card.appendChild(foot);
    box.appendChild(card);
  });

  const addG = el('button', 'cta sec', 'أضف فئة رئيسية جديدة');
  addG.onclick = () => editGroup(null);
  box.appendChild(addG);
  return box;
}

/** The individual entries behind a number — each one editable and removable. */
function showEntries(gid, sub) {
  const g = group(gid);
  const list = entriesOf(gid, sub);
  const body = el('div');
  if (!list.length) body.appendChild(el('div', 'empty', '<b>لا بنود</b>لم يُسجَّل شيء هنا هذا الشهر.'));
  list.forEach(e => {
    const row = el('button', 'row');
    row.type = 'button';
    row.innerHTML = `<div class="nm"><b>${esc(fmt(e.amount))}</b><span>${esc(dateLabel(e.date))}${e.note ? ' · ' + esc(e.note) : ''}</span></div><span class="chev">‹</span>`;
    row.onclick = () => { closeSheet(); editEntry(e); };
    body.appendChild(row);
  });
  const add = el('button', 'cta sec', 'أضف بنداً هنا');
  add.onclick = () => { closeSheet(); editEntry({ gid, sub, amount: 0, date: today() }); };
  body.appendChild(add);
  sheet({ title: g.g + ' ' + g.nm + ' · ' + sub, fields: [], onSave: () => {}, saveLabel: 'تم', extra: body });
}

function nlCard() {
  const card = el('div', 'nl');
  card.innerHTML = `<label for="nlIn">اكتب المصروف بالعربية كما تقوله</label>
    <textarea id="nlIn" placeholder="مصروف ألبان بـ 10,000 ومصرف أولاد بـ 15,000"></textarea>
    <div class="hint">يفهم الأرقام العربية والإنجليزية، و«15 الف»، والفواصل. وكل بند يبقى قابلاً للتعديل أو الحذف بعد إضافته.</div>`;
  const pv = el('div', 'preview');
  const btn = el('button', 'cta', 'أضف إلى الحساب');
  btn.disabled = true;
  card.appendChild(pv); card.appendChild(btn);
  const ta = $('#nlIn', card);
  let parsed = { entries: [], orphan: 0 };
  const refresh = () => {
    parsed = parseLine(ta.value);
    pv.textContent = '';
    parsed.entries.forEach(e => {
      const g = group(e.gid);
      pv.appendChild(el('div', 'pv', `<div class="p1">${esc(g.g)} ${esc(g.nm)} · ${esc(e.sub)}</div><div class="p2">${esc(fmt(e.amount))}</div>`));
    });
    if (ta.value.trim() && !parsed.entries.length) pv.appendChild(el('div', 'pv bad', '<div class="p1">لم أتعرّف على بند ومبلغ بعد. مثال: «لحم مفروم 12,000»</div>'));
    if (parsed.orphan) pv.appendChild(el('div', 'pv bad', `<div class="p1">${parsed.orphan} مبلغ بدون بند — اكتب اسم البند قبل الرقم.</div>`));
    btn.disabled = !parsed.entries.length;
    btn.textContent = parsed.entries.length ? `أضف ${parsed.entries.length} بنداً · ${fmt(parsed.entries.reduce((a, e) => a + e.amount, 0))}` : 'أضف إلى الحساب';
  };
  ta.addEventListener('input', refresh);
  btn.onclick = () => {
    const d = today();
    if (monthOf(d) !== S.month) S.month = monthOf(d);
    parsed.entries.forEach(e => S.spend.push({ id: nextId(), date: d, gid: e.gid, sub: e.sub, amount: e.amount, note: '' }));
    S.demo = false; save(); render();
  };
  return card;
}

/* ============================ door 2 ============================ */
function renderWorks() {
  const box = el('div'), d = today();

  const dh = el('div', 'group');
  dh.appendChild(el('header', null, `<div class="glyph">📖</div><div class="nm">أعمال يومية</div><div class="sum">${S.daily.filter(x => x.done[d]).length}/${S.daily.length}</div>`));
  if (!S.daily.length) dh.appendChild(el('div', 'empty', '<b>لا أعمال يومية</b>أضف وِرداً أو عادة تتابعها كل يوم.'));
  S.daily.forEach(item => {
    const row = el('div', 'row');
    let n = 0, x = new Date();
    for (;;) { const k = x.toISOString().slice(0, 10); if (item.done[k]) { n++; x.setDate(x.getDate() - 1); } else break; }
    const nameBtn = el('button', 'nm');
    nameBtn.type = 'button';
    nameBtn.style.cssText = 'background:none;border:0;text-align:start;font-family:inherit;color:inherit;cursor:pointer;padding:0';
    nameBtn.innerHTML = `<b>${esc(item.nm)}</b><span>${esc(item.note || '')}${n ? ' · ' + n + ' يوم متتابع' : ''}</span>`;
    nameBtn.onclick = () => sheet({
      title: 'تعديل ' + item.nm,
      fields: [{ id: 'nm', label: 'الاسم', type: 'text', value: item.nm }, { id: 'note', label: 'ملاحظة', type: 'text', value: item.note || '' }],
      onSave: v => { if (!v.nm) return false; item.nm = v.nm; item.note = v.note; },
      onDelete: () => { S.daily = S.daily.filter(x => x.id !== item.id); }
    });
    row.appendChild(nameBtn);
    const t = el('button', 'tick', '✓');
    t.setAttribute('aria-pressed', item.done[d] ? 'true' : 'false');
    t.setAttribute('aria-label', 'إتمام ' + item.nm);
    t.onclick = () => { if (item.done[d]) delete item.done[d]; else item.done[d] = 1; save(); render(); };
    row.appendChild(t);
    dh.appendChild(row);
  });
  const addD = el('div', 'row');
  const bD = el('button', 'mini', 'أضف عملاً يومياً');
  bD.onclick = () => sheet({
    title: 'عمل يومي جديد',
    fields: [{ id: 'nm', label: 'الاسم', type: 'text', value: '', ph: 'أذكار، قراءة، رياضة…' }, { id: 'note', label: 'ملاحظة', type: 'text', value: '' }],
    onSave: v => { if (!v.nm) return false; S.daily.push({ id: nextId(), nm: v.nm, note: v.note, done: {} }); }
  });
  addD.appendChild(bD); dh.appendChild(addD);
  box.appendChild(dh);

  const pr = el('div', 'group');
  pr.appendChild(el('header', null, `<div class="glyph">🕌</div><div class="nm">أعمال دورية</div>`));
  if (!S.periodic.length) pr.appendChild(el('div', 'empty', '<b>لا أعمال دورية</b>أضف زيارة تتكرر كل فترة.'));
  S.periodic.forEach(p => {
    const since = p.last ? Math.round((new Date(d) - new Date(p.last)) / 86400000) : null;
    const over = since === null || since >= p.every;
    const row = el('div', 'row');
    const nameBtn = el('button', 'nm');
    nameBtn.type = 'button';
    nameBtn.style.cssText = 'background:none;border:0;text-align:start;font-family:inherit;color:inherit;cursor:pointer;padding:0';
    nameBtn.innerHTML = `<b>${esc(p.nm)}</b><span>${p.last ? 'آخر زيارة ' + esc(dateLabel(p.last)) + ' · قبل ' + since + ' يوم' : 'لم تُسجَّل بعد'} · كل ${p.every} يوم</span>`;
    nameBtn.onclick = () => sheet({
      title: 'تعديل ' + p.nm,
      fields: [
        { id: 'nm', label: 'الاسم', type: 'text', value: p.nm },
        { id: 'every', label: 'كل كم يوم؟', type: 'number', value: p.every },
        { id: 'last', label: 'آخر زيارة', type: 'date', value: p.last || '' }
      ],
      onSave: v => { if (!v.nm) return false; p.nm = v.nm; p.every = v.every || 30; p.last = v.last || null; },
      onDelete: () => { S.periodic = S.periodic.filter(x => x.id !== p.id); }
    });
    row.appendChild(nameBtn);
    row.appendChild(el('span', 'chip ' + (over ? 'warn' : 'good'), over ? 'حان الموعد' : 'في الوقت'));
    const b = el('button', 'mini', 'سجّل');
    b.onclick = () => { p.last = today(); S.log.unshift({ id: nextId(), date: today(), what: p.nm, story: 'سُجِّلت الزيارة من الباب الثاني.' }); save(); render(); };
    row.appendChild(b);
    pr.appendChild(row);
  });
  const addP = el('div', 'row');
  const bP = el('button', 'mini', 'أضف عملاً دورياً');
  bP.onclick = () => sheet({
    title: 'عمل دوري جديد',
    fields: [{ id: 'nm', label: 'الاسم', type: 'text', value: '', ph: 'زيارة…' }, { id: 'every', label: 'كل كم يوم؟', type: 'number', value: 30 }],
    onSave: v => { if (!v.nm) return false; S.periodic.push({ id: nextId(), nm: v.nm, every: v.every || 30, last: null }); }
  });
  addP.appendChild(bP); pr.appendChild(addP);
  box.appendChild(pr);

  const dr = el('div', 'group');
  dr.appendChild(el('header', null, `<div class="glyph">🩺</div><div class="nm">مراجعات الأطباء</div><div class="sum">${S.doctors.length}</div>`));
  if (!S.doctors.length) dr.appendChild(el('div', 'empty', '<b>لا مراجعات</b>سجّل الموعد والتشخيص والمتابعة.'));
  S.doctors.forEach(v => {
    const row = el('button', 'row');
    row.type = 'button';
    row.innerHTML = `<div class="nm"><b>${esc(v.who)}</b><span>${esc(dateLabel(v.date))} · ${esc(v.why || '')}</span><span>${v.dx ? 'التشخيص: ' + esc(v.dx) : ''}</span><span>${v.next ? 'المتابعة: ' + esc(v.next) : ''}</span></div><span class="chev">‹</span>`;
    row.onclick = () => docSheet(v);
    dr.appendChild(row);
  });
  const addDoc = el('div', 'row');
  const bDoc = el('button', 'mini', 'أضف مراجعة');
  bDoc.onclick = () => docSheet(null);
  addDoc.appendChild(bDoc); dr.appendChild(addDoc);
  box.appendChild(dr);
  return box;
}

function docSheet(v) {
  const isNew = !v;
  const rec = v || { date: today(), who: '', why: '', dx: '', next: '' };
  sheet({
    title: isNew ? 'مراجعة طبيب جديدة' : 'تعديل المراجعة',
    fields: [
      { id: 'who', label: 'الطبيب والتخصص', type: 'text', value: rec.who },
      { id: 'date', label: 'التاريخ', type: 'date', value: rec.date },
      { id: 'why', label: 'سبب المراجعة', type: 'text', value: rec.why },
      { id: 'dx', label: 'التشخيص', type: 'text', value: rec.dx },
      { id: 'next', label: 'المتابعة', type: 'area', value: rec.next }
    ],
    onSave: f => {
      if (!f.who) return false;
      Object.assign(rec, f);
      if (isNew) {
        rec.id = nextId();
        S.doctors.unshift(rec);
        S.log.unshift({ id: nextId(), date: rec.date, what: 'مراجعة ' + rec.who, story: [rec.why, rec.dx && 'التشخيص: ' + rec.dx, rec.next && 'المتابعة: ' + rec.next].filter(Boolean).join('\n') });
      }
    },
    onDelete: isNew ? null : () => { S.doctors = S.doctors.filter(x => x.id !== rec.id); }
  });
}

/* ============================ door 3 ============================ */
const KINDS = ['تصليح', 'ترميم', 'مراجعات رسمية'];
const STATUS = ['مقترح', 'قيد التنفيذ', 'منجز'];
function renderProjects() {
  const box = el('div');
  box.appendChild(el('div', 'note', 'عند وضع المشروع في «منجز» تُسجَّل تكلفته في «تكاليف المشاريع» وتُكتب قصته في السجل الزمني.'));
  const kinds = KINDS.concat(S.proposals.map(p => p.kind).filter(k => !KINDS.includes(k)));
  [...new Set(kinds)].forEach(kind => {
    const list = S.proposals.filter(p => p.kind === kind);
    const card = el('div', 'group');
    card.appendChild(el('header', null, `<div class="glyph">${kind === 'تصليح' ? '🔧' : kind === 'ترميم' ? '🧱' : '📋'}</div><div class="nm">${esc(kind)}</div><div class="sum">${esc(fmt(list.reduce((a, p) => a + (p.est || 0), 0)))}</div>`));
    if (!list.length) card.appendChild(el('div', 'empty', '<b>لا مقترحات</b>أضف ما تنوي عمله مع تكلفته التقديرية.'));
    list.forEach(p => {
      const row = el('button', 'row');
      row.type = 'button';
      const cls = p.status === 'منجز' ? 'good' : p.status === 'قيد التنفيذ' ? 'warn' : '';
      row.innerHTML = `<div class="nm"><b>${esc(p.nm)}</b><span>تقديري ${esc(fmt(p.est))}</span></div><span class="chip ${cls}">${esc(p.status)}</span><span class="chev">‹</span>`;
      row.onclick = () => propSheet(p);
      card.appendChild(row);
    });
    const foot = el('div', 'row');
    const add = el('button', 'mini', 'أضف مقترحاً');
    add.onclick = () => propSheet(null, kind);
    foot.appendChild(add); card.appendChild(foot);
    box.appendChild(card);
  });
  return box;
}
function propSheet(p, kind) {
  const isNew = !p;
  const rec = p || { kind: kind || KINDS[0], nm: '', est: 0, status: 'مقترح' };
  const was = rec.status;
  sheet({
    title: isNew ? 'مقترح جديد' : 'تعديل المقترح',
    fields: [
      { id: 'nm', label: 'وصف العمل', type: 'text', value: rec.nm },
      { id: 'kind', label: 'النوع', type: 'select', value: rec.kind, options: KINDS },
      { id: 'est', label: 'التكلفة التقديرية', type: 'money', value: rec.est },
      { id: 'status', label: 'الحالة', type: 'select', value: rec.status, options: STATUS }
    ],
    onSave: v => {
      if (!v.nm) return false;
      Object.assign(rec, { nm: v.nm, kind: v.kind, est: v.est, status: v.status });
      if (isNew) { rec.id = nextId(); S.proposals.push(rec); }
      if (v.status === 'منجز' && was !== 'منجز') {
        S.spend.push({ id: nextId(), date: today(), gid: 'projects', sub: rec.nm, amount: rec.est, note: 'تكلفة المشروع' });
        S.log.unshift({ id: nextId(), date: today(), what: rec.nm, story: 'أُنجز المشروع وسُجِّلت تكلفته ' + fmt(rec.est) + ' في تكاليف المشاريع.' });
      }
    },
    onDelete: isNew ? null : () => { S.proposals = S.proposals.filter(x => x.id !== rec.id); }
  });
}

/* ============================ door 4 ============================ */
function renderLog() {
  const box = el('div');
  box.appendChild(el('div', 'note', 'سجل واحد مؤرخ بلا تفرعات. اضغط أي قصة لتعديلها أو حذفها.'));
  const add = el('button', 'cta', 'أضف قصة إلى السجل');
  add.onclick = () => logSheet(null);
  box.appendChild(add);
  const sorted = [...S.log].sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.id - a.id);
  if (!sorted.length) box.appendChild(el('div', 'empty', '<b>السجل فارغ</b>كل ما تسجّله في الأبواب الأخرى يظهر هنا مؤرخاً.'));
  const tl = el('div', 'tl');
  sorted.forEach(e => {
    const ev = el('div', 'ev');
    const b = el('button', 'box');
    b.type = 'button';
    b.innerHTML = `<div class="when">${esc(dateLabel(e.date))}</div><div class="what">${esc(e.what)}</div>${e.story ? `<div class="story">${esc(e.story)}</div>` : ''}`;
    b.onclick = () => logSheet(e);
    ev.appendChild(b); tl.appendChild(ev);
  });
  box.appendChild(tl);
  return box;
}
function logSheet(e) {
  const isNew = !e;
  const rec = e || { date: today(), what: '', story: '' };
  sheet({
    title: isNew ? 'قصة جديدة' : 'تعديل القصة',
    fields: [
      { id: 'what', label: 'العنوان', type: 'text', value: rec.what, ph: 'زيارة، مراجعة، تصليح…' },
      { id: 'date', label: 'التاريخ', type: 'date', value: rec.date },
      { id: 'story', label: 'القصة', type: 'area', value: rec.story }
    ],
    onSave: v => {
      if (!v.what) return false;
      Object.assign(rec, v);
      if (isNew) { rec.id = nextId(); S.log.unshift(rec); }
    },
    onDelete: isNew ? null : () => { S.log = S.log.filter(x => x.id !== rec.id); }
  });
}

/* ============================ data screen ============================ */
function dataSheet() {
  const body = el('div');
  const ta = el('textarea');
  ta.rows = 6;
  ta.value = JSON.stringify(S);
  ta.setAttribute('aria-label', 'بيانات النسخة الاحتياطية');
  body.appendChild(el('div', 'field', '<label>نسخة احتياطية — انسخ النص واحفظه، أو الصق نسخة قديمة هنا ثم اضغط استرجاع</label>'));
  body.appendChild(ta);

  const copy = el('button', 'cta sec', 'نسخ البيانات');
  copy.onclick = () => {
    ta.select();
    const done = () => { copy.textContent = 'تم النسخ ✓'; setTimeout(() => (copy.textContent = 'نسخ البيانات'), 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done).catch(() => { copy.textContent = 'حدّد النص وانسخه يدوياً'; });
    else copy.textContent = 'حدّد النص وانسخه يدوياً';
  };
  body.appendChild(copy);

  const restore = el('button', 'cta sec', 'استرجاع من النص');
  restore.onclick = () => {
    try {
      const next = JSON.parse(ta.value);
      if (!next || !Array.isArray(next.spend)) throw new Error('bad');
      S = next; if (!Array.isArray(S.tree) || !S.tree.length) S.tree = DEFAULT_TREE();
      save(); closeSheet(); render();
    } catch (err) { restore.textContent = 'النص غير صالح'; setTimeout(() => (restore.textContent = 'استرجاع من النص'), 1600); }
  };
  body.appendChild(restore);

  let armDemo = false;
  const clearDemo = el('button', 'cta danger', 'امسح بيانات التجربة فقط');
  clearDemo.onclick = () => {
    if (!armDemo) { armDemo = true; clearDemo.classList.add('armed'); clearDemo.textContent = 'اضغط مرة أخرى للمسح'; return; }
    S.spend = []; S.doctors = []; S.log = []; S.proposals = [];
    S.periodic.forEach(p => (p.last = null)); S.daily.forEach(d => (d.done = {}));
    S.demo = false; save(); closeSheet(); render();
  };
  body.appendChild(clearDemo);

  let armAll = false;
  const reset = el('button', 'cta danger', 'إعادة كل شيء كما كان');
  reset.onclick = () => {
    if (!armAll) { armAll = true; reset.classList.add('armed'); reset.textContent = 'اضغط مرة أخرى — يُمسح كل شيء'; return; }
    S = seed(); save(); closeSheet(); render();
  };
  body.appendChild(reset);

  sheet({ title: 'البيانات', fields: [], onSave: () => {}, saveLabel: 'تم', extra: body });
}

/* ============================ shell ============================ */
const DOORS = [
  { n: 1, nm: 'المادي', note: 'الباب الأول', title: 'الباب الأول — الجانب المادي', sub: 'الإنفاق الشهري والمشاريع والطوارئ والمحروقات. اضغط أي سطر لتعديله أو حذفه.', ico: 'M3 11h18M6 11V7a6 6 0 0112 0v4M8 21h8' },
  { n: 2, nm: 'الأعمال', note: 'الباب الثاني', title: 'الباب الثاني — مجموع الأعمال', sub: 'الأذكار اليومية، الزيارات الدورية، ومراجعات الأطباء.', ico: 'M4 6h16M4 12h16M4 18h10' },
  { n: 3, nm: 'المشاريع', note: 'الباب الثالث', title: 'الباب الثالث — المشاريع المقترحة', sub: 'تصليح، ترميم، ومراجعات رسمية — من المقترح إلى المنجز.', ico: 'M3 20h18M6 20V9l6-5 6 5v11' },
  { n: 4, nm: 'التوثيق', note: 'الباب الرابع', title: 'الباب الرابع — التوثيق الشامل', sub: 'سجل زمني موحّد لكل حدث، بلا تفرعات.', ico: 'M12 7v5l4 2M12 3a9 9 0 100 18 9 9 0 000-18z' }
];

function renderTabs() {
  const t = $('#tabs'); t.textContent = '';
  DOORS.forEach(d => {
    const b = el('button', null, `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="${d.ico}"/></svg><b>${esc(d.nm)}</b><span>${esc(d.note)}</span>`);
    b.type = 'button';
    if (S.door === d.n) b.setAttribute('aria-current', 'true');
    b.onclick = () => { S.door = d.n; save(); render(); window.scrollTo(0, 0); };
    t.appendChild(b);
  });
}

function monthBar() {
  const bar = el('div', 'month');
  const prev = el('button', null, '‹'), next = el('button', null, '›');
  prev.type = next.type = 'button';
  prev.setAttribute('aria-label', 'الشهر السابق'); next.setAttribute('aria-label', 'الشهر التالي');
  const shift = k => { const [y, m] = S.month.split('-').map(Number); S.month = new Date(y, m - 1 + k, 1).toISOString().slice(0, 7); save(); render(); };
  prev.onclick = () => shift(-1); next.onclick = () => shift(1);
  bar.appendChild(next);
  bar.appendChild(el('div', 'label', esc(monthLabel(S.month))));
  bar.appendChild(prev);
  return bar;
}

function render() {
  const d = DOORS.find(x => x.n === S.door) || DOORS[0];
  $('#doorTitle').textContent = d.title;
  $('#doorSub').textContent = d.sub;
  const host = $('#screen'); host.textContent = '';
  if (S.door === 1) host.appendChild(monthBar());
  if (S.demo) {
    const n = el('div', 'note', 'الأرقام الظاهرة أمثلة للتجربة.');
    const b = el('button', 'cta sec', 'امسحها وابدأ من فارغ');
    b.onclick = () => {
      S.spend = []; S.doctors = []; S.log = []; S.proposals = [];
      S.periodic.forEach(p => (p.last = null)); S.daily.forEach(x => (x.done = {}));
      S.demo = false; save(); render();
    };
    n.appendChild(b);
    host.appendChild(n);
  }
  host.appendChild(S.door === 1 ? renderMoney() : S.door === 2 ? renderWorks() : S.door === 3 ? renderProjects() : renderLog());
  renderTabs();
}

$('#themeBtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const n = cur === 'dark' ? 'light' : cur === 'light' ? null : 'dark';
  if (n) document.documentElement.setAttribute('data-theme', n); else document.documentElement.removeAttribute('data-theme');
  S.theme = n; save();
};
$('#dataBtn').onclick = dataSheet;
try { if (S.theme) document.documentElement.setAttribute('data-theme', S.theme); } catch (e) {}
render();
</script>
