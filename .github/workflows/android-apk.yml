# Builds the installable Daily Assistant APK. GitHub's runners already carry the
# Android SDK, so the APK is produced here and attached to the run as an artifact.
name: Build Daily Assistant APK

on:
  push:
    paths:
      - 'android-daily-assistant/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-daily-assistant

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-daily-assistant/**/*.gradle.kts', 'android-daily-assistant/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk daily-assistant.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-assistant-apk
          path: android-daily-assistant/daily-assistant.apk
          if-no-files-found: error
          retention-days: 90
